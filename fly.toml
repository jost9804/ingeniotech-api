app = "ingeniotech-api"
primary_region = "iad"

[env]
  APP_NAME = "Ingeniotech"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_TIMEZONE = "America/Bogota"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
