app = "ingeniotech-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_NAME = "Ingeniotech"
  APP_ENV = "production"
  APP_DEBUG = "false"
  APP_TIMEZONE = "America/Bogota"
  LOG_CHANNEL = "stack"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    enabled = true
    interval = 10000
    timeout = 5000
    grace_period = "30s"
    method = "GET"
    path = "/up"
